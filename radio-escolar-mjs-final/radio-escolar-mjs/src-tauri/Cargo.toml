[package]
name = "radio-escolar"
version = "1.0.0"
description = "Rádio Escolar Mestre João Silvério"
edition = "2021"
license = "MIT"

[lib]
name = "radio_escolar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
radio-core = { path = "../crates/radio-core", features = ["serde"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Áudio local: rodio (decodificação MP3/WAV/OGG/FLAC via Symphonia, licenças MIT/Apache/MPL-2.0) + cpal (WASAPI no Windows)
rodio = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
lofty = "0.22"
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power"] }
