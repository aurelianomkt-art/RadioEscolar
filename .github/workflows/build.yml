name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  testes-agendador:
    name: Testes do agendador (radio-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (sem e com serde)
        run: |
          cargo test --manifest-path crates/radio-core/Cargo.toml
          cargo test --manifest-path crates/radio-core/Cargo.toml --features serde

  windows:
    name: Instalador e versão portátil
    needs: testes-agendador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Dependências da interface
        run: npm install
      - name: Testes do agendador no Windows
        run: cargo test -p radio-core
      - name: Compilar e empacotar (NSIS + MSI)
        run: npx tauri build
      - name: Montar versão portátil
        shell: pwsh
        run: |
          $rel = "target/release"
          $exe = Get-ChildItem $rel -Filter *.exe | Where-Object { $_.Name -notlike "*build*" } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path portatil | Out-Null
          Copy-Item $exe.FullName "portatil/Radio Escolar MJS.exe"
          "Versão portátil: os dados ficam na pasta 'dados' ao lado deste arquivo. Requer WebView2 (já presente no Windows 10/11 atualizado)." | Out-File -Encoding utf8 portatil/portatil.txt
          Compress-Archive -Path portatil/* -DestinationPath "Radio-Escolar-MJS-portatil.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-nsis
          path: target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-msi
          path: target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: versao-portatil
          path: Radio-Escolar-MJS-portatil.zip
